[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "__PKG_NAME__"
version = "1.0.0"
description = "Noxs __PKG_NAME__ package"
requires-python = ">=3.9"

[project.scripts]
__PKG_NAME__ = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-dir]
"" = "src"
