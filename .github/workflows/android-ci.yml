name: android-ci

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: newer ubuntu-24.04 runner images ship NO Android SDK, and
      # android-actions/setup-android@v3 is broken upstream (it runs
      # `sdkmanager tools`, a package Google removed). So we install the SDK
      # deterministically from Google's official cmdline-tools zip.
      - name: Android SDK (cmdline-tools + NDK + CMake)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle setup (official action, wrapper-free capable)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Provision wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build + unit tests
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noxs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/

  rootfs-validation:
    name: Bootstrap + filesystem security validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate manifests, sync, shell tooling
        run: |
          chmod +x scripts/*.sh linux-runtime/**/*.sh 2>/dev/null || true
          scripts/test.sh --manifests
          scripts/test.sh --sync-check
          scripts/test.sh --scripts

      - name: Filesystem security tests (JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run security-focused unit tests
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7; fi
          ./gradlew noxs-shared:test terminal-emulator:test

  release:
    name: Release (signed APK)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android-build, rootfs-validation ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship no Android SDK anymore — install it (see android-build note)
      - name: Android SDK (cmdline-tools + NDK + CMake)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          NOXS_KEYSTORE_B64: ${{ secrets.NOXS_KEYSTORE_B64 }}
        run: |
          if [ -n "$NOXS_KEYSTORE_B64" ]; then
            echo "$NOXS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noxs.keystore"
            echo "NOXS_KEYSTORE_FILE=$RUNNER_TEMP/noxs.keystore" >> "$GITHUB_ENV"
          else
            echo "NOXS_KEYSTORE_FILE=" >> "$GITHUB_ENV"
          fi

      - name: Build signed release
        env:
          NOXS_KEYSTORE_PASSWORD: ${{ secrets.NOXS_KEYSTORE_PASSWORD }}
          NOXS_KEY_ALIAS: ${{ secrets.NOXS_KEY_ALIAS }}
          NOXS_KEY_PASSWORD: ${{ secrets.NOXS_KEY_PASSWORD }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7; fi
          ./gradlew assembleRelease --stacktrace

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
